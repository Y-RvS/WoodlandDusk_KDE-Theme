# Cat Leader — Kitty Terminal Theme
# Inspired by golden-hour woodland light


# Fonts
font             
font_family      Maple Mono Italic
bold_font        Maple Mono Bold
italic_font      Maple Mono Italic
bold_italic_font Maple Mono Bold Italic
font_size        10.0
 
# Cursor
cursor                  #C8A96E
cursor_text_color       #1B2A1E
cursor_shape            block
cursor_blink_interval   0.5
cursor_stop_blinking_after 15.0
 
# Scrollback
scrollback_lines 10000
 
# Mouse
mouse_hide_wait 3.0
url_color       #A3B87A
url_style       curly
 
# Window
window_padding_width    24
background_opacity      0.85
dynamic_background_opacity yes
 
# Tab bar
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_background      #1B2A1E
tab_bar_margin_color    #1B2A1E
active_tab_foreground   #1B2A1E
active_tab_background   #C8A96E
active_tab_font_style   bold
inactive_tab_foreground #8C7A6B
inactive_tab_background #243B28
inactive_tab_font_style normal
 
# Colors — Cat Leader palette
# background  : Forest Shadow
# foreground  : Cat White
background              #1B2A1E
foreground              #D8C9B8
selection_background    #6A8C50
selection_foreground    #1B2A1E
 
# Black
color0  #1B2A1E
color8  #3A5C3E
 
# Red (Flag Red)
color1  #B85A38
color9  #CC6E4A
 
# Green (Sunlit Leaf / Meadow Glow)
color2  #6A8C50
color10 #A3B87A
 
# Yellow / Amber (Golden Hour)
color3  #C8A96E
color11 #DEC08A
 
# Blue (muted teal-blue from fireflies / shadows)
color4  #4A7A6A
color12 #6A9E8C
 
# Magenta (distant haze / bark undertone)
color5  #8C6A5A
color13 #AA8878
 
# Cyan (Moss + meadow mix)
color6  #5C8C6A
color14 #80B090
 
# White (Petal Mist / Cat White)
color7  #D8C9B8
color15 #EDE8DF
 
# Bell
enable_audio_bell no
visual_bell_duration 0.1
visual_bell_color #B85A38
 
# Misc
update_check_interval 0
