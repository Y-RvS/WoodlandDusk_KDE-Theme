# Cat Leader — Kitty Terminal Theme
# Inspired by golden-hour woodland light


# Fonts
font             
font_family      Maple Mono Italic
bold_font        Maple Mono Bold
italic_font      Maple Mono Italic
bold_italic_font Maple Mono Bold Italic
font_size        10.0
 
# Cursor
cursor       #ddc999
cursor_shape            beam
cursor_blink_interval   0.5
cursor_stop_blinking_after 15.0
 
# Scrollback
scrollback_lines 10000
 
# Mouse
mouse_hide_wait 3.0
url_color       #A3B87A
url_style       curly
 
# Window
window_padding_width    24
background_opacity      0.85
dynamic_background_opacity yes
 
# Tab bar
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_background      #1B2A1E
tab_bar_margin_color    #1B2A1E
active_tab_foreground   #1B2A1E
active_tab_background   #C8A96E
active_tab_font_style   bold
inactive_tab_foreground #8C7A6B
inactive_tab_background #243B28
inactive_tab_font_style normal
 
# Colors — Cat Leader palette
# background  : Forest Shadow
# foreground  : Cat White
foreground   #ddc999
background   #121210

color0       #121210
color8       #9a8c6b
color1       #5F564C
color9       #5F564C
color2       #766F51
color10      #766F51
color3       #9B672A
color11      #9B672A
color4       #887658
color12      #887658
color5       #A99D22
color13      #A99D22
color6       #A18D5B
color14      #A18D5B
color7       #ddc999
color15      #ddc999
 
# Bell
enable_audio_bell no
visual_bell_duration 0.1
visual_bell_color #B85A38
 
# Misc
update_check_interval 0
